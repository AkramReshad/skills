name: Consolidate workspace notes

on:
  workflow_call:
    secrets:
      TYPESAFE_API_KEY:
        required: true

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: AkramReshad/skills
          path: .note_tools
          persist-credentials: false
      - name: Consolidate notes added yesterday
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python .note_tools/scripts/consolidate-notes.py
      - name: Commit note changes
        run: |
          if [[ -n "$(git status --porcelain -- notes)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- notes
            git commit -m "Consolidate workspace notes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
