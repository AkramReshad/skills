name: Consolidate workspace notes

on:
  workflow_call:
    inputs:
      format_notes:
        description: Instruct the rewrite agent to run Prettier using the caller's .github/actions/setup-web toolchain.
        type: boolean
        default: false
      formatter_directory:
        description: Repository directory containing the installed Prettier.
        type: string
        default: '.'
    secrets:
      TYPESAFE_API_KEY:
        required: true
      CODEX_AUTH_JSON:
        required: true

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    concurrency:
      group: overnight-notes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: AkramReshad/skills
          path: .note_tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Codex SDK
        run: pip install -r .note_tools/codex/hooks/requirements.txt
      - name: Identify Codex login state
        id: auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: echo "key=$(node .note_tools/scripts/codex-auth-state.mjs key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/codex-auth.enc
          key: codex-auth-${{ steps.auth.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codex-auth-${{ steps.auth.outputs.key }}-
      - name: Restore Codex login
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node .note_tools/scripts/codex-auth-state.mjs restore
      - name: Setup notes formatter
        if: inputs.format_notes
        uses: ./.github/actions/setup-web
      - name: Consolidate notes added yesterday
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          NOTES_FORMATTER_DIRECTORY: ${{ inputs.formatter_directory }}
        run: >-
          python .note_tools/scripts/consolidate-notes.py
          ${{ inputs.format_notes && '--format-notes' || '' }}
          --formatter-directory "$NOTES_FORMATTER_DIRECTORY"
      - name: Encrypt refreshed Codex login
        if: always() && steps.auth.outputs.key != ''
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: node .note_tools/scripts/codex-auth-state.mjs save
      - uses: actions/cache/save@v4
        if: always() && steps.auth.outputs.key != ''
        with:
          path: ${{ runner.temp }}/codex-auth.enc
          key: codex-auth-${{ steps.auth.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit note changes
        id: commit_notes
        run: bash .note_tools/scripts/commit-consolidated-notes.sh
      - name: Retain generated notes after a publish failure
        if: failure() && steps.commit_notes.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: consolidated-notes-patch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consolidated-notes.patch
          retention-days: 7
          if-no-files-found: error
