name: Test notes publishing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-notes-publishing.yml
      - .github/workflows/reusable-notes-consolidation.yml
      - scripts/commit-consolidated-notes.sh
      - scripts/tests/test_commit_consolidated_notes.py
  pull_request:
    paths:
      - .github/workflows/test-notes-publishing.yml
      - .github/workflows/reusable-notes-consolidation.yml
      - scripts/commit-consolidated-notes.sh
      - scripts/tests/test_commit_consolidated_notes.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: bash -n scripts/commit-consolidated-notes.sh
      - run: python -m unittest discover -s scripts/tests -v
